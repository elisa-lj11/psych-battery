<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psych Battery</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2a2a3a;
      --text: #e0e0f0;
      --muted: #6060a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
      gap: 0;
    }

    h1 {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    #battery-wrap {
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
      width: 100%;
      max-width: 360px;
    }

    .breakdown {
      width: 100%;
      max-width: 360px;
      margin-bottom: 2rem;
    }

    .drain-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.45rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      gap: 0.75rem;
    }

    .drain-row .app-label { flex: 1; color: var(--text); }
    .drain-row .mins { color: var(--muted); font-size: 0.78rem; min-width: 36px; text-align: right; }
    .drain-row .rate-badge {
      font-size: 0.72rem;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      background: var(--border);
      min-width: 36px;
      text-align: center;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    #error {
      color: #f87171;
      font-size: 0.82rem;
      margin-top: 1.5rem;
      text-align: center;
      line-height: 1.6;
      display: none;
      max-width: 360px;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  </style>
</head>
<body>
  <h1>Psych Battery</h1>

  <div id="battery-wrap">
    <svg width="212" height="90" viewBox="0 0 212 90">
      <rect x="0" y="0" width="200" height="90" rx="10" fill="none" stroke="#2a2a3a" stroke-width="3"/>
      <rect x="202" y="30" width="10" height="30" rx="3" fill="#2a2a3a"/>
    </svg>
  </div>

  <p class="section-title">Activity breakdown</p>
  <div class="breakdown">
    <div id="breakdown-list"></div>
  </div>

  <div class="controls">
    <span id="last-updated"></span>
  </div>

  <div id="error"></div>

  <script>
    const AW = '/aw';

    // ── Drain rules ───────────────────────────────────────────────────────────
    // Patterns match app name OR window title (case-insensitive, substring).
    // First match wins. Rate = drain units per minute.
    // Negative rate = recharge (used for AFK below, but you can add low-stim apps here too).
    const DRAIN_RULES = [
      // ● High drain — cognitive output + social stimulation + AI
      // Title patterns catch browser-wrapped versions of these apps
      { patterns: ['claude', 'chatgpt', 'gemini', 'copilot', 'cursor', 'perplexity', 'gpt', 'mistral', 'openai'],        rate: 15.0, label: 'AI Tools' },
      { patterns: ['zoom', 'teams', 'webex', 'whereby', 'loom', 'meet -', '| meet', 'google meet', 'zoom meeting'],       rate: 15.0, label: 'Video Calls' },
      { patterns: ['slack', 'discord', 'telegram', 'whatsapp', 'messenger', 'signal'],                                    rate: 14.0, label: 'Messaging' },
      { patterns: ['twitter', 'x.com', '/ x', 'reddit', 'instagram', 'tiktok', 'facebook', 'linkedin', 'hacker news'],   rate: 14.0, label: 'Social Media' },
      { patterns: ['outlook', 'gmail', 'mail', 'thunderbird'],                                                             rate: 12.0, label: 'Email' },

      // ● Medium drain — focused work
      { patterns: ['code', 'visual studio', 'intellij', 'pycharm', 'vim', 'nvim', 'emacs', 'sublime', 'zed'],             rate: 12.0, label: 'Coding' },
      { patterns: ['figma', 'sketch', 'photoshop', 'illustrator', 'affinity', 'canva'],                                   rate: 12.0, label: 'Design' },
      { patterns: ['notion', 'obsidian', 'onenote', 'google docs', 'google sheets', 'google slides'],                     rate: 10.0, label: 'Documents' },
      { patterns: ['word', 'excel', 'pages', 'numbers', 'powerpoint', 'keynote'],                                         rate: 10.0, label: 'Documents' },
      { patterns: ['chrome', 'firefox', 'safari', 'edge', 'brave', 'opera', 'arc'],                                       rate: 10.0, label: 'Browser' },

      // ● Low drain — passive / ambient
      { patterns: ['youtube', 'netflix', 'vlc', 'plex', 'hbo', 'prime video', 'twitch'],                                  rate: 6.0, label: 'Video' },
      { patterns: ['spotify', 'music', 'podcasts', 'apple music'],                                                         rate: 4.0, label: 'Music' },
      { patterns: ['explorer', 'finder', 'terminal', 'cmd', 'powershell', 'bash', 'wt', 'iterm'],                         rate: 4.0, label: 'System' },

      // ● Fallback
      { patterns: [], rate: 8.0, label: 'Other' },
    ];

    const HIGH_DRAIN_CAP = 15.0;
    const WINDOW_MINS    = 2;

    // ── State ─────────────────────────────────────────────────────────────────
    const windowHours = WINDOW_MINS / 60;
    let windowBucket  = null;
    let afkBucket     = null;
    const sessionStart = new Date(); // battery always starts at 100% from here

    // ── API helpers ───────────────────────────────────────────────────────────
    async function apiFetch(path) {
      const res = await fetch(AW + path);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    }

    async function findBuckets() {
      const buckets = await apiFetch('/buckets');
      const ids = Object.keys(buckets);
      windowBucket = ids.find(id => id.startsWith('aw-watcher-window_')) ?? null;
      afkBucket    = ids.find(id => id.startsWith('aw-watcher-afk_'))    ?? null;
    }

    async function getEvents(bucketId, start, end) {
      const s = encodeURIComponent(start);
      const e = encodeURIComponent(end);
      return apiFetch(`/buckets/${encodeURIComponent(bucketId)}/events?start=${s}&end=${e}&limit=-1`);
    }

    // ── Drain logic ───────────────────────────────────────────────────────────
    function matchRule(event) {
      const app   = (event.data.app   ?? '').toLowerCase();
      const title = (event.data.title ?? '').toLowerCase();
      for (const rule of DRAIN_RULES) {
        if (rule.patterns.length === 0) return rule; // fallback
        if (rule.patterns.some(p => app.includes(p) || title.includes(p))) return rule;
      }
      return DRAIN_RULES[DRAIN_RULES.length - 1];
    }

    function calculate(windowEvents, windowStart, now) {
      const tally = {};
      let totalDrain   = 0;
      let totalActMins = 0;

      for (const ev of windowEvents) {
        const evStart = new Date(ev.timestamp).getTime();
        const evEnd   = evStart + ev.duration * 1000;
        const clipped = (Math.min(evEnd, now.getTime()) - Math.max(evStart, windowStart.getTime())) / 1000;
        const mins = clipped / 60;
        if (mins < 0.1) continue;
        const rule = matchRule(ev);
        if (!tally[rule.label]) tally[rule.label] = { minutes: 0, drain: 0, rate: rule.rate };
        tally[rule.label].minutes += mins;
        tally[rule.label].drain  += mins * rule.rate;
        totalDrain   += mins * rule.rate;
        totalActMins += mins;
      }

      // Capacity = max drain over the full window (not just active time),
      // so the battery depletes as time passes with active use.
      const capacity = windowHours * 60 * HIGH_DRAIN_CAP;
      const battery  = Math.round(Math.max(0, Math.min(100, 100 - (totalDrain / capacity) * 100)));

      return { battery, tally, totalActMins: Math.round(totalActMins) };
    }

    // ── Rendering ─────────────────────────────────────────────────────────────
    function levelColor(pct) {
      if (pct > 60) return '#4ade80';
      if (pct > 35) return '#facc15';
      if (pct > 15) return '#fb923c';
      return '#f87171';
    }

    function rateColor(rate) {
      if (rate >= 2.5) return '#f87171';
      if (rate >= 1.5) return '#fb923c';
      if (rate >= 1.0) return '#facc15';
      return '#4ade80';
    }

    function renderBattery(level, trend) {
      const W = 200, H = 90, pad = 6;
      const color     = levelColor(level);
      const fillW     = Math.max(0, (W - pad * 2) * (level / 100));
      const isLow     = level < 20;
      const textFill  = level < 40 ? color : '#0f0f13';
      const arrow     = trend === 'up' ? '↑' : trend === 'down' ? '↓' : '';
      const arrowColor = trend === 'up' ? '#4ade80' : '#f87171';

      document.getElementById('battery-wrap').innerHTML = `
        <svg width="${W + 12}" height="${H + 22}" viewBox="0 0 ${W + 12} ${H + 22}">
          <rect x="0" y="0" width="${W}" height="${H}" rx="10" fill="none" stroke="#2a2a3a" stroke-width="3"/>
          <rect x="${W + 2}" y="${(H - 30) / 2}" width="10" height="30" rx="3" fill="#2a2a3a"/>
          <rect x="${pad}" y="${pad}" width="${fillW}" height="${H - pad * 2}" rx="6"
            fill="${color}"${isLow ? ' style="animation:pulse 1s ease-in-out infinite"' : ''}/>
          <text x="${W / 2}" y="${H / 2 + 8}" text-anchor="middle"
            font-family="system-ui,sans-serif" font-size="24" font-weight="700"
            fill="${textFill}">${level}%</text>
          ${arrow ? `<text x="${W / 2}" y="${H + 18}" text-anchor="middle"
            font-family="system-ui,sans-serif" font-size="16"
            fill="${arrowColor}">${arrow}</text>` : ''}
        </svg>`;
    }

    function renderBreakdown(tally) {
      const rows = Object.entries(tally)
        .filter(([, v]) => v.minutes >= 0.05)
        .sort((a, b) => b[1].drain - a[1].drain);

      document.getElementById('breakdown-list').innerHTML =
        rows.map(([label, v]) => `
          <div class="drain-row">
            <span class="app-label">${label}</span>
            <span class="mins">${v.minutes < 1 ? Math.round(v.minutes * 60) + 's' : Math.round(v.minutes) + 'm'}</span>
            <span class="rate-badge" style="color:${rateColor(v.rate)}">×${v.rate.toFixed(1)}</span>
          </div>`).join('')
        || '<div style="color:var(--muted);font-size:0.82rem;padding:0.6rem 0">No activity in this window.</div>';
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.innerHTML = msg;
      el.style.display = 'block';
    }

    function clearError() {
      document.getElementById('error').style.display = 'none';
    }

    // ── Main loop ─────────────────────────────────────────────────────────────
    async function update() {
      clearError();
      try {
        const now = new Date();

        // Fetch pre-calculated battery from server (same source as the display)
        const windowStart = new Date(Math.max(
          sessionStart.getTime(),
          now.getTime() - WINDOW_MINS * 60 * 1000
        ));
        const [stateRes, eventsData] = await Promise.all([
          fetch('/state'),
          (async () => {
            if (!windowBucket) await findBuckets();
            if (!windowBucket) return [];
            return getEvents(windowBucket, windowStart.toISOString(), now.toISOString());
          })(),
        ]);

        const state   = await stateRes.json();
        const battery = state.battery_pct;
        const trend   = state.trend ?? 'flat';

        const { tally, totalActMins } = calculate(eventsData, windowStart, now);

        renderBattery(battery, trend);
        renderBreakdown(tally);

        document.getElementById('last-updated').textContent =
          `Updated ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

      } catch (err) {
        showError(
          `Could not reach server.<br>` +
          `<small style="color:var(--muted)">${err.message}</small>`
        );
        console.error(err);
      }
    }

    update();
    setInterval(update, 10_000);
  </script>
</body>
</html>
